# Настройки тестов.
# Приоритет: -Dkey=value -> переменная окружения UPPER_SNAKE (PLATFORM, APPIUM_URL, WIKI_USER, ...)
# -> этот файл -> значение по умолчанию из lib/Config.java.
# Пути можно задавать относительными: они разрешаются от каталога запуска (user.dir).

# android | ios | mobile_web
platform=android

appium.url=http://127.0.0.1:4723/wd/hub

android.device=AndroidTestDevice
android.version=8.0
android.app=apks/org.wikipedia.apk

ios.device=iPhone SE (3rd generation)
ios.version=16.4
ios.app=apps/Wikipedia.app

chrome.driver=chromedriver

wiki.url=https://en.m.wikipedia.org
# Логин и пароль тестового аккаунта для Mobile Web. Оставьте пустыми, если списки не проверяются:
# тесты с авторизацией будут помечены как skipped.
wiki.user=
wiki.password=

# Таймаут ожиданий по умолчанию, секунды
timeout.default=15

# true — перед сессией приложение переустанавливается (fullReset), а welcome-экран пропускается в setUp.
# Нужен чистый стейт приложения: -Dreset.app=true
reset.app=false
